name: Offline inference contracts
on: [push, pull_request, workflow_dispatch]
jobs:
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-inference.txt
      - run: python -m pytest -q
      - run: python populate_predictions.py --output-dir outputs/ci
      - run: python score.py --predictions outputs/ci/validation_predictions.csv --december-predictions outputs/ci/december_chart_inputs.csv --output-dir outputs/ci/format
